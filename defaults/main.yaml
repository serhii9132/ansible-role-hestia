# Administrator email for HestiaCP (used for system notifications, sysadmin account, and Let's Encrypt)
hestia_admin_mail: "admin@example.com"

# Password for the default 'sysadmin' account in the HestiaCP web interface
hestia_admin_password: "Password123"

# Fully Qualified Domain Name (FQDN) for the server and control panel access
hestia_hostname: "hostname.domain.tld"

# Primary custom nameserver (NS1) for the default DNS zone
hestia_nameserver_1: "ns1.{{ hestia_hostname }}"

# Secondary custom nameserver (NS2) for the default DNS zone
hestia_nameserver_2: "ns2.{{ hestia_hostname }}"

# List of PHP versions to install (will be parsed as a comma-separated string via --multiphp flag)
hestia_php_list_versions:
  - "5.6"
  - "7.0"
  - "7.1"
  - "7.2"
  - "7.3"
  - "7.4"
  - "8.0"
  - "8.1"
  - "8.2"
  - "8.3"
  - "8.4"
